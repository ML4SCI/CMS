# Physics-Aware Gating (PAG): self-supervised pretraining of the gated LorentzParT.
# Settings follow the fixed_normalisation_BPAG_LorentzParT notebook.
model:
    num_classes: 10
    embed_dim: 128
    num_heads: 8
    num_layers: 8
    num_cls_layers: 2
    num_mlp_layers: 0
    hidden_dim: 256
    hidden_mv_channels: 8
    in_s_channels:
    out_s_channels:
    hidden_s_channels: 16
    attention:
        # Physics-aware gate on every particle attention block (see src/models/particle_transformer.py)
        use_gating: True
        gate_type: 'headwise'  # 'headwise' or 'elementwise'
        use_mass_bias: True  # condition the gate on the jet invariant mass (GeV)
    mlp: {}
    reinsert_mv_channels:
    reinsert_s_channels:
    dropout: 0.1
    expansion_factor: 4
    max_num_particles: 128
    num_particle_features: 4
    pair_embed_dims: [64, 64, 64]
    mask: True
    weights:
    inference: False


train:
    batch_size: 128  # with ROOT data on several GPUs it must be divisible by 10 * number of GPUs
    criterion:
        # All supported loss functions can be found in 'src/loss/loss_registry.py'
        name: 'conservation_loss'
        kwargs:
            loss_coef: [0.25, 0.25, 0.25, 0.25]  # [pT, eta, phi, energy]
            reduction: 'mean'  # 'mean', 'sum', 'none'
    optimizer:
        # All supported optimizers can be found in 'src/optim/optim_registry.py'
        name: 'adamw'
        kwargs:
            lr: 0.0001
    scheduler:
        # All supported schedulers can be found in 'src/optim/scheduler_registry.py'
        name: 'exponential_lr'
        kwargs:
            gamma: 0.95
    # No early stopping: pretraining always runs all num_epochs; the best epoch (lowest val_loss)
    # is still saved to logs/LorentzParT/best/. Supported callbacks are in 'src/utils/callbacks.py'
    callbacks: []
    num_epochs: 20
    start_epoch: 0
    logging_dir: 'logs'
    logging_steps: 1000
    progress_bar: False
    save_best: True
    save_ckpt: True
    save_fig: True
    plots_dir: 'plots'  # PNG figures go to plots/<model name>/
    num_workers: 0
    pin_memory: True
