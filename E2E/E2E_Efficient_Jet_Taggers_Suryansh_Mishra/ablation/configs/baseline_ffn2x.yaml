# Wave 0 dense-capacity screen: 2× FFN hidden width, stock PairEmbed and width.
#
# expansion_factor 8 → FFN hidden 1024 (baseline is 4 → 512). Same QKV, same
# PairEmbed [64, 64, 64], same 8 heads. Answers whether FFN MoE failed because
# FFN is the wrong knob, or because routing starved each expert.
#
# max_steps caps the screen at 200k. The LR schedule still spans total_steps=1M
# so steps match baseline / nopair at 150k / 175k / 200k.
#
# Do not add this to submit_all.sh. New run_name so it cannot resume baseline.
_base: baseline.yaml

arm: baseline
run_name: baseline_ffn2x
experiment: scale_capacity_wave0

expansion_factor: 8
max_steps: 200000
